# Kanıtlanmış native build (Novfensec SAMPLE-KIVYMD-APP tabanlı)
# Docker action 5 dk'da patlıyordu — bu yöntem develop + tam apt deps kullanır.

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - buildozer.spec
      - hooks/**
      - android_res/**
      - java/**
      - .github/workflows/android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      GRADLE_HOME: ""
      ANDROID_NDK: ""
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_NDK_LATEST_HOME: ""

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Prepare config
        run: cp config.ornek.json config.json

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-bz-global-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            ${{ runner.os }}-bz-global-

      - name: Cache project .buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-bz-app-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            ${{ runner.os }}-bz-app-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg zip unzip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            libunwind-dev zlib1g-dev autoconf-archive \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            autoconf libtool automake libltdl-dev m4 pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev autopoint gettext \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev xvfb

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.android/licenses/android-sdk-license"
          echo "84831b9409646a918e305718201e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "d97579ad9d454c3b62de4ce1053f43212e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "601085b94cd77f0b157e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "33b6a2b64607f11b759f220" >> "$HOME/.android/licenses/android-sdk-license"
          echo "8403addf88ab4874007e1c" > "$HOME/.android/licenses/android-sdk-preview-license"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Gradle memory
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF
          pkill -9 -f GradleDaemon 2>/dev/null || true

      - name: Install Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==3.0.11"

      - name: Prefetch build packages
        run: |
          PKG="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          mkdir -p "$PKG"
          FT="$PKG/freetype-2.14.1.tar.gz"
          MARK="$PKG/.mark-freetype-2.14.1.tar.gz"
          if [ ! -f "$MARK" ]; then
            for url in \
              "https://github.com/freetype/freetype/releases/download/VER-2-14-1/freetype-2.14.1.tar.gz" \
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"; do
              echo "Downloading freetype from $url"
              if curl -fL --retry 8 --retry-delay 15 --retry-all-errors -o "$FT" "$url"; then
                touch "$MARK"
                break
              fi
            done
          fi
          test -f "$MARK" || (echo "freetype prefetch failed" && exit 1)

      - name: Build APK
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export ORG_GRADLE_JAVA_HOME="$JAVA_HOME"
          export GRADLE_OPTS="-Xmx3072m -XX:MaxMetaspaceSize=768m"
          export PATH="$JAVA_HOME/bin:$PATH"
          df -h
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          set +o pipefail
          EC=1
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3"
            yes 2>/dev/null | buildozer -v android debug 2>&1 | tee buildozer.log
            EC=${PIPESTATUS[1]}
            [ "$EC" -eq 0 ] && break
            if grep -qE "502|Bad Gateway|Download failed|No space left" buildozer.log; then
              echo "Transient error, cleaning and retrying in 45s..."
              rm -rf .buildozer/android/platform/build-*/build 2>/dev/null || true
              df -h
              sleep 45
              continue
            fi
            break
          done
          set -o pipefail
          exit $EC

      - name: Cleanup build intermediates
        if: always()
        run: |
          rm -rf .buildozer/android/platform/build-*/build/intermediates 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-*/build/tmp 2>/dev/null || true
          df -h

      - name: Show errors if failed
        if: failure()
        run: |
          if [ -f buildozer.log ]; then
            grep -E "ERROR|Error|failed|Traceback|config\.pxi|gradlew" buildozer.log | tail -n 40 || true
          fi
          ls -la bin/ 2>/dev/null || echo "bin/ yok"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: falimabak-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
