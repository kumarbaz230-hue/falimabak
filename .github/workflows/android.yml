name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GRADLE_HOME: ""
      ANDROID_NDK: ""
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_NDK_LATEST_HOME: ""
      USE_OPENGL_ES2: "1"
      USE_SDL2: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache SDK packages only
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/packages
          key: bz-pkgs-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-pkgs-v5-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libglib2.0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libavutil-dev

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.android/licenses/android-sdk-license"
          echo "84831b9409646a918e305718201e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "d97579ad9d454c3b62de4ce1053f43212e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "601085b94cd77f0b157e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "33b6a2b64607f11b759f220" >> "$HOME/.android/licenses/android-sdk-license"
          echo "8403addf88ab4874007e1c" > "$HOME/.android/licenses/android-sdk-preview-license"

      - name: Prepare config
        run: cp config.ornek.json config.json

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.33" "git+https://github.com/kivy/buildozer.git@master"

      - name: Show spec
        run: |
          grep requirements buildozer.spec
          python --version
          java -version

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export ORG_GRADLE_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          rm -rf .buildozer bin
          set +o pipefail
          yes 2>/dev/null | buildozer -v android debug 2>&1 | tee buildozer.log
          EC=${PIPESTATUS[1]}
          set -o pipefail
          echo "buildozer exit code: $EC"
          exit $EC

      - name: Dump build log
        if: always()
        run: |
          echo "===== HATA OZETI ====="
          if [ -f buildozer.log ]; then
            grep -E "config.pxi|gradlew failed|Command failed|FAILURE:|ERROR:|Traceback|Error code" buildozer.log | tail -n 50 || true
            echo "===== SON 120 SATIR ====="
            tail -n 120 buildozer.log
          else
            echo "buildozer.log bulunamadi"
          fi
          ls -la bin/ 2>/dev/null || echo "bin/ yok"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: falimabak-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 7
