name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare config
        run: cp config.ornek.json config.json

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer_global
            .buildozer/android/packages
          key: bz-docker-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-docker-v1-

      - name: Build with Buildozer (Docker)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: pip install --user 'Cython==0.29.34' && buildozer -v android debug
          buildozer_version: stable

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: falimabak-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            .buildozer/**/*.log
            bin/**
          if-no-files-found: ignore
