name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GRADLE_HOME: ""
      ANDROID_NDK: ""
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_NDK_LATEST_HOME: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache SDK packages only
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/packages
          key: bz-pkgs-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-pkgs-v2-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libavutil-dev

      - name: Prepare config
        run: cp config.ornek.json config.json

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" buildozer

      - name: Show spec
        run: |
          grep requirements buildozer.spec
          java -version

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export ORG_GRADLE_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          rm -rf .buildozer bin
          # accept_sdk_license=True spec'te; yes pipe gradlew'da broken pipe yapar
          buildozer -v android debug > buildozer.log 2>&1
          EC=$?
          echo "===== HATA OZETI ====="
          grep -E "gradlew failed|Command failed|FAILURE:|ERROR:|Traceback|Error code" buildozer.log | tail -n 50 || true
          echo "===== SON 120 SATIR ====="
          tail -n 120 buildozer.log
          ls -la bin/ 2>/dev/null || echo "bin/ yok"
          exit $EC

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: falimabak-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 7
