# Play Store Release AAB (imzali)
# Manuel: Actions sekmesinden "Build Release AAB" calistir

name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - buildozer.spec
      - .github/workflows/android-release.yml

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    env:
      GRADLE_HOME: ""
      ANDROID_NDK: ""
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_NDK_LATEST_HOME: ""

    steps:
      - uses: actions/checkout@v4

      - name: Prepare config
        run: cp config.ornek.json config.json

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret tanimli degil — release build atlanir"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/falimabak-release.keystore

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-bz-release-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            ${{ runner.os }}-bz-release-
            ${{ runner.os }}-bz-global-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg zip unzip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            libunwind-dev zlib1g-dev autoconf-archive \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            autoconf libtool automake libltdl-dev m4 pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev autopoint gettext \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev xvfb

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.android/licenses/android-sdk-license"
          echo "84831b9409646a918e305718201e" >> "$HOME/.android/licenses/android-sdk-license"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Gradle memory
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF
          pkill -9 -f GradleDaemon 2>/dev/null || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==3.0.11"

      - name: Prefetch build packages
        run: |
          PKG="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          mkdir -p "$PKG"
          FT="$PKG/freetype-2.14.1.tar.gz"
          MARK="$PKG/.mark-freetype-2.14.1.tar.gz"
          if [ ! -f "$MARK" ]; then
            for url in \
              "https://github.com/freetype/freetype/releases/download/VER-2-14-1/freetype-2.14.1.tar.gz" \
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"; do
              echo "Downloading freetype from $url"
              if curl -fL --retry 8 --retry-delay 15 --retry-all-errors -o "$FT" "$url"; then
                touch "$MARK"
                break
              fi
            done
          fi
          test -f "$MARK" || (echo "freetype prefetch failed" && exit 1)

      - name: Build signed AAB
        env:
          P4A_RELEASE_KEYSTORE: /tmp/falimabak-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export ORG_GRADLE_JAVA_HOME="$JAVA_HOME"
          export GRADLE_OPTS="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          export PATH="$JAVA_HOME/bin:$PATH"
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          set +o pipefail
          EC=1
          for attempt in 1 2 3; do
            echo "Release build attempt $attempt/3"
            yes 2>/dev/null | buildozer -v android release 2>&1 | tee buildozer-release.log
            EC=${PIPESTATUS[1]}
            [ "$EC" -eq 0 ] && break
            if grep -qE "502|Bad Gateway|Download failed" buildozer-release.log; then
              echo "Transient download error, retrying in 45s..."
              sleep 45
              continue
            fi
            break
          done
          set -o pipefail
          exit $EC

      - name: Show errors if failed
        if: failure()
        run: |
          if [ -f buildozer-release.log ]; then
            grep -E "ERROR|Error|failed|Traceback|gradlew|Manifest" buildozer-release.log | tail -n 50 || true
            tail -n 30 buildozer-release.log || true
          fi
          ls -la bin/ 2>/dev/null || echo "bin/ yok"

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: falimabak-release-aab
          path: bin/*release*.aab
          if-no-files-found: error

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-release-log
          path: buildozer-release.log
          if-no-files-found: ignore
