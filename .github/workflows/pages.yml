# GitHub Pages — gizlilik + app-ads.txt (AdMob)
name: Deploy Privacy Page

on:
  push:
    branches: [main]
    paths:
      - 'store/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp store/gizlilik.html _site/index.html
          cp store/gizlilik.html _site/gizlilik.html
          if [ -f docs/app-ads.txt ]; then
            cp docs/app-ads.txt _site/app-ads.txt
          else
            cp store/app-ads.txt _site/app-ads.txt
          fi
          touch _site/.nojekyll
          echo "--- site ---"
          ls -la _site/
          cat _site/app-ads.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
